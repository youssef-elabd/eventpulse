<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — EventPulse</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">EventPulse<span class="dot">.</span></a>
    <nav class="main-nav"><a href="index.html">Browse</a></nav>
    <div id="auth-area"></div>
  </div>
</header>

<main class="container">
  <div class="form-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to register for events and see live announcements.</p>
    <div class="form-error" id="form-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-full" type="submit">Log in</button>
    </form>
    <p class="form-foot">Don't have an account? <a href="register.html" style="color:var(--violet);font-weight:600;">Sign up</a></p>
    <p class="form-foot" style="margin-top:-10px;">Seeded admin: admin@eventpulse.com / Admin@1234</p>
  </div>
</main>

<script src="js/api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('form-error');
  errorBox.classList.remove('show');

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const { token, data } = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    Store.setToken(token);
    Store.setUser(data.user);
    toast(`Welcome back, ${data.user.name.split(' ')[0]}!`, 'success');
    const next = new URLSearchParams(window.location.search).get('next');
    setTimeout(() => (window.location.href = next || 'index.html'), 400);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  }
});
</script>
</body>
</html>
