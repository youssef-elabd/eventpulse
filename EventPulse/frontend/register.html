<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — EventPulse</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">EventPulse<span class="dot">.</span></a>
    <nav class="main-nav"><a href="index.html">Browse</a></nav>
    <div id="auth-area"></div>
  </div>
</header>

<main class="container">
  <div class="form-card">
    <h1>Create your account</h1>
    <p class="sub">Register for events and get live updates the moment they happen.</p>
    <div class="form-error" id="form-error"></div>
    <form id="register-form">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary btn-full" type="submit">Create account</button>
    </form>
    <p class="form-foot">Already have an account? <a href="login.html" style="color:var(--violet);font-weight:600;">Log in</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('form-error');
  errorBox.classList.remove('show');

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const { token, data } = await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password }),
    });
    Store.setToken(token);
    Store.setUser(data.user);
    toast(`Welcome, ${data.user.name.split(' ')[0]}!`, 'success');
    setTimeout(() => (window.location.href = 'index.html'), 400);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  }
});
</script>
</body>
</html>
